# Example: Running the Crypto Quote Producer with Docker Compose

version: '3.8'

services:
  # Run the Coinbase BTC-USD producer
  crypto-producer-coinbase:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: crypto-quotes
      EXCHANGE: coinbase
      SYMBOL: BTC-USD
      SLF4J_DEFAULT_LOG_LEVEL: INFO
    depends_on:
      - kafka
    networks:
      - crypto-network

  # Example: Kraken BTC/USD producer (uncomment to run)
  # crypto-producer-kraken:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   environment:
  #     KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  #     KAFKA_TOPIC: crypto-quotes
  #     EXCHANGE: kraken
  #     SYMBOL: BTC/USD
  #     SLF4J_DEFAULT_LOG_LEVEL: INFO
  #   depends_on:
  #     - kafka
  #   networks:
  #     - crypto-network

  # Example: OKX BTC-USDC producer (uncomment to run)
  # crypto-producer-okx:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   environment:
  #     KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  #     KAFKA_TOPIC: crypto-quotes
  #     EXCHANGE: okx
  #     SYMBOL: BTC-USDC
  #     SLF4J_DEFAULT_LOG_LEVEL: INFO
  #   depends_on:
  #     - kafka
  #   networks:
  #     - crypto-network

  # Kafka broker (from the main deployment)
  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    networks:
      - crypto-network

  # Optional: Kafka console consumer for viewing messages
  consumer:
    image: apache/kafka:3.7.0
    entrypoint: /bin/sh
    command: >
      -c "kafka-console-consumer.sh
          --bootstrap-server kafka:9092
          --topic crypto-quotes
          --from-beginning
          --property print.timestamp=true
          --property print.key=true"
    depends_on:
      - kafka
    networks:
      - crypto-network

networks:
  crypto-network:
    driver: bridge
