# Secret template for Kafka broker connection
# IMPORTANT: This file contains placeholder values and should NOT be committed with real credentials.
# Before applying, replace YOUR_BROKER_HOST:9092 with the actual Kafka bootstrap server address.
#
# Example:
#   KAFKA_BOOTSTRAP_SERVERS: "kafka.example.com:9092"
#   KAFKA_BOOTSTRAP_SERVERS: "broker1.internal:9092,broker2.internal:9092,broker3.internal:9092"

apiVersion: v1
kind: Secret
metadata:
  name: kafka-broker-secret
  namespace: crypto-producers
  labels:
    app: crypto-quote-producer
type: Opaque
stringData:
  # Replace with actual broker address(es)
  KAFKA_BOOTSTRAP_SERVERS: "YOUR_BROKER_HOST:9092"
